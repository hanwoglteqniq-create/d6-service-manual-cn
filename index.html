<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D6维修手册">
<meta name="theme-color" content="#6a1b9a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>D6装订器维修手册</title>
<!-- PWA 框架样式 -->
<link rel="stylesheet" href="manual/mobile.css">
<!-- 手册原始样式 -->
<link rel="stylesheet" href="manual/common_e2/css/manual.css">
</head>
<body>

<!-- 顶部导航栏 -->
<div id="app-header">
    <div class="menu-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </div>
    <h1 id="header-title">D6装订器维修手册</h1>
    <div class="menu-btn" onclick="toggleInstallUI()" title="安装到主屏幕">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </div>
</div>

<!-- 安装提示 -->
<div id="install-banner" style="display:none;">
    <div class="install-content">
        <p>将手册添加到主屏幕，可离线使用</p>
        <button onclick="installApp()" id="install-btn">安装</button>
        <button onclick="this.parentElement.parentElement.style.display='none'">关闭</button>
    </div>
</div>

<!-- 侧边栏遮罩 -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- 侧边栏 -->
<div id="sidebar">
    <div class="sidebar-header">D6装订器维修手册</div>
    <div id="search-bar">
        <input type="text" placeholder="搜索章节..." id="search-input" oninput="filterMenu(this.value)">
    </div>
    <div class="menu-tree" id="menu-tree"></div>
</div>

<!-- 主内容区域（使用 iframe 确保手册样式完全隔离） -->
<div id="app-content">
    <iframe id="content-frame" frameborder="0" style="width:100%;border:none;min-height:calc(100vh - 56px);"></iframe>
</div>

<!-- 上/下页导航 -->
<div id="page-nav-bar" style="display:none;">
    <button id="nav-prev" onclick="goPrev()">&#8592; 上一页</button>
    <button id="nav-next" onclick="goNext()">下一页 &#8594;</button>
</div>

<!-- 返回顶部 -->
<div id="back-to-top" onclick="document.getElementById('content-frame').contentWindow.scrollTo({top:0,behavior:'smooth'})">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
</div>

<script>
var menuData = null;
var currentUrl = '';
var prevUrl = '';
var nextUrl = '';
var deferredPrompt = null;

// ========== PWA 安装逻辑 ==========
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('installDismissed')) {
        document.getElementById('install-banner').style.display = 'block';
    }
});
window.addEventListener('appinstalled', function() {
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
});
function installApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
            if (result.outcome === 'accepted') localStorage.setItem('installDismissed', '1');
            deferredPrompt = null;
        });
    } else {
        var banner = document.getElementById('install-banner');
        banner.style.display = 'block';
        banner.querySelector('p').textContent = '请点击浏览器底部的"分享"按钮，然后选择"添加到主屏幕"';
        document.getElementById('install-btn').style.display = 'none';
    }
}
function toggleInstallUI() { installApp(); }

// ========== Service Worker ==========
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', function() {
    loadMenu();
    loadContent('manual/welcome.html');
});

// ========== 菜单 ==========
function loadMenu() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'manual/menu_data.json', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            menuData = JSON.parse(xhr.responseText);
            renderMenu(menuData);
        }
    };
    xhr.send();
}

function renderMenu(items, container, level) {
    level = level || 0;
    container = container || document.getElementById('menu-tree');
    var ul = document.createElement('ul');
    if (level > 0) ul.className = 'sub-menu';
    items.forEach(function(item) {
        var li = document.createElement('li');
        if (item.type === 'folder' && item.children && item.children.length > 0) {
            var link = document.createElement('a');
            link.className = level === 0 ? 'chap-link' : '';
            link.setAttribute('data-search', ((item.title || '') + ' ' + (item.title_en || '')).toLowerCase());
            var toggle = document.createElement('span');
            toggle.className = 'folder-toggle';
            toggle.innerHTML = '&#9654;';
            toggle.onclick = function(e) {
                e.stopPropagation();
                this.classList.toggle('open');
                var sub = this.parentNode.querySelector('.sub-menu');
                if (sub) sub.classList.toggle('open');
            };
            link.appendChild(toggle);
            link.appendChild(document.createTextNode(item.title || ''));
            if (item.href) {
                link.onclick = function(e) {
                    if (e.target.classList.contains('folder-toggle')) return;
                    loadContent('manual/' + item.href);
                    closeSidebar();
                };
            } else {
                link.onclick = function(e) {
                    if (e.target.classList.contains('folder-toggle')) return;
                    var sub = li.querySelector('.sub-menu');
                    var tog = li.querySelector('.folder-toggle');
                    if (sub) sub.classList.toggle('open');
                    if (tog) tog.classList.toggle('open');
                };
            }
            li.appendChild(link);
            if (item.children) renderMenu(item.children, li, level + 1);
        } else if (item.href) {
            var link = document.createElement('a');
            link.className = level === 1 ? 'sub-link' : level > 1 ? 'sub-sub-link' : '';
            link.setAttribute('data-search', ((item.title || '') + ' ' + (item.title_en || '')).toLowerCase());
            var icon = document.createElement('span');
            icon.className = 'doc-icon';
            icon.innerHTML = '&#9679;';
            link.appendChild(icon);
            link.appendChild(document.createTextNode(item.title || ''));
            link.onclick = function() {
                loadContent('manual/' + item.href);
                closeSidebar();
            };
            li.appendChild(link);
        } else if (item.title) {
            var link = document.createElement('a');
            link.style.color = '#999';
            link.style.fontStyle = 'italic';
            link.setAttribute('data-search', (item.title || '').toLowerCase());
            link.appendChild(document.createTextNode(item.title));
            li.appendChild(link);
        }
        ul.appendChild(li);
    });
    container.appendChild(ul);
}

function filterMenu(query) {
    var q = query.toLowerCase().trim();
    var tree = document.getElementById('menu-tree');
    var allLinks = tree.querySelectorAll('a[data-search]');
    if (!q) {
        allLinks.forEach(function(a) { a.parentNode.style.display = ''; });
        tree.querySelectorAll('.sub-menu').forEach(function(ul) { ul.classList.remove('open'); });
        return;
    }
    allLinks.forEach(function(a) {
        var text = a.getAttribute('data-search') || '';
        if (text.indexOf(q) >= 0) {
            a.parentNode.style.display = '';
            var parent = a.parentNode.parentNode;
            while (parent) {
                if (parent.classList && parent.classList.contains('sub-menu')) parent.classList.add('open');
                parent = parent.parentNode;
            }
        } else {
            a.parentNode.style.display = 'none';
        }
    });
}

// ========== iframe 内容加载 ==========
function loadContent(url) {
    currentUrl = url;
    var iframe = document.getElementById('content-frame');
    var navBar = document.getElementById('page-nav-bar');
    navBar.style.display = 'none';

    // 读取HTML，注入导航脚本后写入iframe
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            injectAndRender(xhr.responseText, url);
        } else {
            iframe.srcdoc = '<div style="padding:20px;color:red;">页面加载失败: ' + xhr.status + '</div>';
        }
    };
    xhr.onerror = function() {
        iframe.srcdoc = '<div style="padding:20px;color:red;">网络错误</div>';
    };
    xhr.send();
}

function injectAndRender(html, url) {
    var iframe = document.getElementById('content-frame');
    var doc = new DOMParser().parseFromString(html, 'text/html');

    // 提取标题
    var title = doc.querySelector('title');
    if (title) document.getElementById('header-title').textContent = title.textContent;

    // 提取上/下页
    var prevInput = doc.querySelector('input[name="prev_html"]');
    var nextInput = doc.querySelector('input[name="next_html"]');
    prevUrl = prevInput ? prevInput.value : '';
    nextUrl = nextInput ? nextInput.value : '';

    // 修复 CSS 路径
    var base = url.substring(0, url.lastIndexOf('/') + 1);
    var links = doc.querySelectorAll('link[href]');
    links.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('data:')) {
            link.setAttribute('href', resolveUrl(base, href));
        }
    });

    // 修复图片路径
    var imgs = doc.querySelectorAll('img[src]');
    imgs.forEach(function(img) {
        var src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('data:')) {
            img.setAttribute('src', resolveUrl(base, src));
        }
    });

    // 修复 area 链接
    var areas = doc.querySelectorAll('area[href]');
    areas.forEach(function(area) {
        var href = area.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('javascript')) {
            area.setAttribute('href', 'javascript:void(0)');
            area.setAttribute('data-target', resolveUrl(base, href));
        }
    });

    // 修复内部链接 — 使用 postMessage 通知父页面
    var allLinks = doc.querySelectorAll('a[href]');
    allLinks.forEach(function(a) {
        var href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('javascript') && !href.startsWith('#')) {
            var resolved = resolveUrl(base, href);
            a.setAttribute('href', 'javascript:void(0)');
            a.setAttribute('data-target', resolved);
            a.addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({type: 'navigate', url: this.getAttribute('data-target')}, '*');
            });
        }
    });

    // 移除 form/data 隐藏字段
    var form = doc.querySelector('form[name="data"]');
    if (form) form.remove();

    // 注入移动端适配样式
    var style = doc.createElement('style');
    style.textContent = [
        'body { margin: 8px !important; padding: 0 !important; font-size: 14px !important; overflow-x: hidden !important; }',
        '#main { padding: 0 !important; margin: 0 !important; }',
        'h2, h3 { font-size: 1.2em !important; }',
        'table { max-width: 100% !important; overflow-x: auto !important; display: block !important; font-size: 12px !important; }',
        'img { max-width: 100% !important; height: auto !important; }',
        'td, th { padding: 4px 6px !important; word-break: break-word !important; }',
        '.trHighlight td { background: #e3f2fd !important; }',
        '@media (max-width: 600px) {',
        '  body { font-size: 13px !important; margin: 4px !important; }',
        '  table { font-size: 11px !important; }',
        '  td, th { padding: 2px 3px !important; }',
        '}'
    ].join('\n');
    doc.head.appendChild(style);

    // 注入导航脚本（用于 area 点击）
    var script = doc.createElement('script');
    script.textContent = [
        'document.querySelectorAll("area[data-target]").forEach(function(area){',
        '  area.addEventListener("click", function(){',
        '    var url = this.getAttribute("data-target");',
        '    window.parent.postMessage({type:"navigate", url:url}, "*");',
        '  });',
        '});',
        // 通知父页面加载完成和iframe高度
        'window.addEventListener("load", function(){',
        '  var h = document.documentElement.scrollHeight;',
        '  window.parent.postMessage({type:"resize", height: h}, "*");',
        '});',
        'var observer = new MutationObserver(function(){',
        '  var h = document.documentElement.scrollHeight;',
        '  window.parent.postMessage({type:"resize", height: h}, "*");',
        '});',
        'observer.observe(document.body, {childList:true, subtree:true});'
    ].join('\n');
    doc.head.appendChild(script);

    // 写入iframe
    var contentHTML = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    iframe.srcdoc = contentHTML;

    // 更新导航栏
    updateNavBar();
}

function updateNavBar() {
    var navBar = document.getElementById('page-nav-bar');
    var prevBtn = document.getElementById('nav-prev');
    var nextBtn = document.getElementById('nav-next');
    if (prevUrl || nextUrl) {
        navBar.style.display = 'flex';
        prevBtn.style.visibility = prevUrl ? 'visible' : 'hidden';
        nextBtn.style.visibility = nextUrl ? 'visible' : 'hidden';
    } else {
        navBar.style.display = 'none';
    }
}

function goPrev() { if (prevUrl) loadContent(resolveUrl(currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1), prevUrl)); }
function goNext() { if (nextUrl) loadContent(resolveUrl(currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1), nextUrl)); }

// 监听 iframe 消息
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'navigate') {
        loadContent(e.data.url);
        closeSidebar();
    }
    if (e.data && e.data.type === 'resize') {
        var iframe = document.getElementById('content-frame');
        var h = Math.max(e.data.height, 400);
        iframe.style.height = h + 'px';
    }
});

function resolveUrl(base, relative) {
    if (relative.startsWith('./')) relative = relative.substring(2);
    if (relative.startsWith('/')) return relative;
    var parts = base.split('/').filter(function(p) { return p; });
    relative.split('/').forEach(function(seg) {
        if (seg === '..') parts.pop();
        else if (seg !== '.' && seg !== '') parts.push(seg);
    });
    return parts.join('/');
}

// ========== UI 控制 ==========
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
}
</script>
</body>
</html>
