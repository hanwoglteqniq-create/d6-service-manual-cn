<style>
/* ========== AI 聊天面板样式 ========== */
#ai-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c4dff, #536dfe);
    color: #fff;
    border: none;
    box-shadow: 0 4px 16px rgba(108, 99, 255, 0.4);
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
}
#ai-chat-btn:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(108, 99, 255, 0.5); }
#ai-chat-btn svg { width: 28px; height: 28px; }
#ai-chat-btn.hidden { display: none; }

#ai-chat-panel {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 380px;
    height: 100vh;
    max-width: 100vw;
    background: #fafafa;
    z-index: 10000;
    display: none;
    flex-direction: column;
    box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
#ai-chat-panel.open { display: flex; }

@media (max-width: 500px) {
    #ai-chat-panel { width: 100vw; }
    #ai-chat-btn { bottom: 16px; right: 16px; width: 50px; height: 50px; }
}

.chat-header {
    background: linear-gradient(135deg, #7c4dff, #536dfe);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.chat-header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
}
.chat-header-title svg { width: 22px; height: 22px; }
.chat-close-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 22px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
}
.chat-close-btn:hover { color: #fff; }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
}

.chat-msg {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: msgFadeIn 0.25s ease-out;
}
@keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg.bot { align-self: flex-start; }

.chat-msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
}
.chat-msg.bot .chat-msg-avatar { background: #e8eaf6; color: #536dfe; }
.chat-msg.user .chat-msg-avatar { background: #c5cae9; color: #3949ab; }

.chat-msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
}
.chat-msg.bot .chat-msg-bubble {
    background: #fff;
    color: #333;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.chat-msg.user .chat-msg-bubble {
    background: #536dfe;
    color: #fff;
    border-bottom-right-radius: 4px;
}

.chat-msg-bubble p { margin: 0 0 8px 0; }
.chat-msg-bubble p:last-child { margin-bottom: 0; }
.chat-msg-bubble strong { font-weight: 600; }
.chat-msg-bubble code {
    background: #f0f0f0;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "Courier New", monospace;
}
.chat-msg-bubble ul, .chat-msg-bubble ol {
    margin: 4px 0;
    padding-left: 20px;
}
.chat-msg-bubble li { margin-bottom: 3px; }
.chat-msg-bubble .source-link {
    display: inline-block;
    color: #536dfe;
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    margin-top: 6px;
}
.chat-msg-bubble .source-link:hover { color: #304ffe; }

.typing-indicator {
    display: flex;
    gap: 4px;
    padding: 4px 0;
}
.typing-indicator span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9e9e9e;
    animation: typingBounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}

.chat-input-area {
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
}
.chat-input-area textarea {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    line-height: 1.4;
    resize: none;
    outline: none;
    max-height: 100px;
    font-family: inherit;
    transition: border-color 0.2s;
}
.chat-input-area textarea:focus { border-color: #536dfe; }
.chat-send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c4dff, #536dfe);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
}
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-send-btn svg { width: 20px; height: 20px; }

.chat-welcome {
    text-align: center;
    padding: 30px 20px;
    color: #757575;
}
.chat-welcome-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
    background: #e8eaf6;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.chat-welcome-icon svg { width: 28px; height: 28px; color: #536dfe; }
.chat-welcome h3 { font-size: 16px; color: #424242; margin: 0 0 8px; }
.chat-welcome p { font-size: 13px; margin: 0 0 12px; line-height: 1.5; }
.chat-suggestion {
    display: inline-block;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 12px;
    color: #536dfe;
    cursor: pointer;
    margin: 3px;
    transition: background 0.2s, border-color 0.2s;
}
.chat-suggestion:hover { background: #e8eaf6; border-color: #c5cae9; }

.chat-error {
    background: #ffebee;
    color: #c62828;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 8px;
}
</style>

<script>
/* ========== 全局变量 ========== */
var menuData = null;
var searchIndex = null;
var currentUrl = '';
var prevUrl = '';
var nextUrl = '';
var deferredPrompt = null;
var searchMode = 'fulltext';
var searchTimer = null;
var chatHistory = [];
var isStreaming = false;

/* ========== PWA 安装 ========== */
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('installDismissed')) {
        document.getElementById('install-banner').style.display = 'block';
    }
});
window.addEventListener('appinstalled', function() {
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
});
function installApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
            if (result.outcome === 'accepted') localStorage.setItem('installDismissed', '1');
            deferredPrompt = null;
        });
    } else {
        var banner = document.getElementById('install-banner');
        banner.style.display = 'block';
        banner.querySelector('p').textContent = '请点击浏览器底部的"分享"按钮，然后选择"添加到主屏幕"';
        document.getElementById('install-btn').style.display = 'none';
    }
}

/* ========== Service Worker ========== */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
}

/* ========== 初始化 ========== */
document.addEventListener('DOMContentLoaded', function() {
    loadMenu();
    loadSearchIndex();
    loadContent('manual/welcome.html');

    var input = document.getElementById('search-input');
    input.addEventListener('input', function() {
        var q = this.value.trim();
        document.getElementById('search-clear').style.display = q ? '' : 'none';
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            if (searchMode === 'fulltext') doFulltextSearch(q);
            else filterMenu(q);
        }, 300);
    });
    input.addEventListener('focus', function() {
        if (searchMode === 'fulltext' && searchIndex && !this.value.trim()) {
            document.getElementById('search-results').style.display = 'block';
            document.getElementById('menu-tree').style.display = 'none';
            document.getElementById('search-results').innerHTML = '<div class="search-hint">输入关键字搜索手册正文内容</div>';
        }
    });
});

/* ========== AI 聊天面板 ========== */
function toggleChatPanel() {
    var panel = document.getElementById('ai-chat-panel');
    var btn = document.getElementById('ai-chat-btn');
    panel.classList.toggle('open');
    btn.classList.toggle('hidden');
    if (panel.classList.contains('open')) {
        document.getElementById('chat-input').focus();
    }
}

function askSuggestion(el) {
    var q = el.textContent;
    document.getElementById('chat-input').value = q;
    sendChatMessage();
}

function handleChatKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
    }
}

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function sendChatMessage() {
    var input = document.getElementById('chat-input');
    var question = input.value.trim();
    if (!question || isStreaming) return;

    var welcome = document.getElementById('chat-welcome');
    if (welcome) welcome.style.display = 'none';

    appendMessage('user', question);
    input.value = '';
    input.style.height = 'auto';

    isStreaming = true;
    document.getElementById('chat-send-btn').disabled = true;

    var typingEl = appendTyping();
    callDeepSeek(question, typingEl);
}

function appendMessage(role, content) {
    var container = document.getElementById('chat-messages');
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'chat-msg-avatar';
    avatar.innerHTML = role === 'bot' ? '&#129302;' : '&#128100;';

    var bubble = document.createElement('div');
    bubble.className = 'chat-msg-bubble';
    bubble.innerHTML = role === 'bot' ? renderMarkdown(content) : escapeHtml(content);

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return bubble;
}

function appendTyping() {
    var container = document.getElementById('chat-messages');
    var div = document.createElement('div');
    div.className = 'chat-msg bot';
    div.id = 'typing-msg';

    var avatar = document.createElement('div');
    avatar.className = 'chat-msg-avatar';
    avatar.innerHTML = '&#129302;';

    var bubble = document.createElement('div');
    bubble.className = 'chat-msg-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return bubble;
}

/* ========== 本地 RAG 检索 ========== */
function localRagSearch(query, maxResults) {
    maxResults = maxResults || 5;
    if (!searchIndex || !searchIndex.length) return [];

    var q = query.toLowerCase();
    var keywords = q.split(/\s+/).filter(function(k) { return k.length > 1; });
    if (keywords.length === 0) keywords = [q];

    var scored = [];
    for (var i = 0; i < searchIndex.length; i++) {
        var entry = searchIndex[i];
        var textLower = (entry.text || '').toLowerCase();
        var titleLower = (entry.menu_title || entry.title || '').toLowerCase();
        var score = 0;

        for (var k = 0; k < keywords.length; k++) {
            var kw = keywords[k];
            var tc = 0, ti = 0, p = 0;
            while ((p = titleLower.indexOf(kw, p)) !== -1) { ti++; p += kw.length; }
            p = 0;
            while ((p = textLower.indexOf(kw, p)) !== -1) { tc++; p += kw.length; }
            if (ti > 0) score += ti * 12;
            if (tc > 0) score += tc * 3;
            if (titleLower.indexOf(q) >= 0) score += 20;
            if (textLower.indexOf(q) >= 0) score += 8;
        }

        if (score > 0) {
            var snippet = extractSnippet(entry.text || '', keywords, 600);
            scored.push({
                title: entry.menu_title || entry.title || '未知章节',
                href: entry.href,
                snippet: snippet,
                score: score
            });
        }
    }

    scored.sort(function(a, b) { return b.score - a.score; });
    return scored.slice(0, maxResults);
}

function extractSnippet(text, keywords, maxLen) {
    var bestStart = 0, bestScore = 0;
    for (var offset = 0; offset < Math.min(text.length, maxLen * 3); offset += 40) {
        var seg = text.substring(offset, offset + maxLen);
        var sc = 0;
        for (var k = 0; k < keywords.length; k++) {
            var kw = keywords[k], p = 0;
            while ((p = seg.toLowerCase().indexOf(kw, p)) !== -1) { sc++; p += kw.length; }
        }
        if (sc > bestScore) { bestScore = sc; bestStart = offset; }
    }
    var s = text.substring(bestStart, bestStart + maxLen);
    if (bestStart > 0) s = '...' + s;
    if (bestStart + maxLen < text.length) s += '...';
    return s.trim();
}

/* ========== 调用 DeepSeek API（前端直连 + RAG） ========== */
function callDeepSeek(question, typingBubble) {
    var systemPrompt = '你是富士施乐(Fujifilm Business Innovation) D6装订器(D6finiFB)维修手册的AI技术助手。\n\n回答规则：\n1. 优先基于下方【手册参考内容】回答，答案应准确引用\n2. 如果手册内容不足，可补充通用维修知识，但需标注"（通用知识）"\n3. 使用中文回答，专业术语可保留英文\n4. 按步骤说明，使用编号列表\n5. 涉及安全操作时加"⚠️ 安全注意"提示\n6. 回答末尾用"📖 参考"标注来源章节\n7. 不要编造手册中没有的零件编号或参数';

    // 本地 RAG 检索
    var ragResults = localRagSearch(question, 5);
    var contextBlock = '';
    if (ragResults.length > 0) {
        contextBlock = '\n\n【手册参考内容】\n\n' + ragResults.map(function(r, i) {
            return '--- 参考[' + (i+1) + '] ' + r.title + ' ---\n' + r.snippet;
        }).join('\n\n');
    } else {
        contextBlock = '\n\n【手册参考内容】：未检索到高度相关的内容，请根据通用维修知识回答，并标注为非手册内容。';
    }

    var messages = [
        { role: 'system', content: systemPrompt + contextBlock }
    ];

    // 加入历史对话（最近3轮）
    var historySlice = chatHistory.slice(-6);
    for (var h = 0; h < historySlice.length; h++) {
        messages.push(historySlice[h]);
    }
    messages.push({ role: 'user', content: question });

    // 通过 DeepSeek 兼容代理调用（解决国内直连问题）
    var apiUrl = 'https://api.deepseek.com/chat/completions';

    fetch(apiUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer sk-640a965a6814402b90319e9f4729a3d4'
        },
        body: JSON.stringify({
            model: 'deepseek-chat',
            messages: messages,
            stream: true,
            temperature: 0.3,
            max_tokens: 2000
        })
    }).then(function(response) {
        if (!response.ok) {
            return response.text().then(function(t) {
                throw new Error('API 返回错误 (' + response.status + '): ' + t.substring(0, 200));
            });
        }

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var fullContent = '';
        typingBubble.innerHTML = '';

        function pump() {
            return reader.read().then(function(result) {
                if (result.done) {
                    chatHistory.push({ role: 'user', content: question });
                    chatHistory.push({ role: 'assistant', content: fullContent });
                    isStreaming = false;
                    document.getElementById('chat-send-btn').disabled = false;
                    return;
                }

                var text = decoder.decode(result.value, { stream: true });
                var lines = text.split('\n');

                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (line.indexOf('data: ') === 0) {
                        var data = line.slice(6);
                        if (data === '[DONE]') {
                            chatHistory.push({ role: 'user', content: question });
                            chatHistory.push({ role: 'assistant', content: fullContent });
                            isStreaming = false;
                            document.getElementById('chat-send-btn').disabled = false;
                            return;
                        }
                        try {
                            var json = JSON.parse(data);
                            var delta = json.choices && json.choices[0] && json.choices[0].delta;
                            if (delta && delta.content) {
                                fullContent += delta.content;
                                typingBubble.innerHTML = renderMarkdown(fullContent);
                                document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
                return pump();
            });
        }
        return pump();

    }).catch(function(err) {
        var typingMsg = document.getElementById('typing-msg');
        if (typingMsg) typingMsg.remove();

        appendMessage('bot', '');
        var allBubbles = document.querySelectorAll('.chat-msg.bot .chat-msg-bubble');
        var lastBubble = allBubbles[allBubbles.length - 1];
        if (lastBubble) {
            lastBubble.innerHTML = '<div class="chat-error">&#9888; ' + escapeHtml(err.message) + '</div>' +
                '<p style="font-size:12px;color:#999;margin-top:8px;">如果提示网络错误，可能是 DeepSeek API 在国内需要代理访问。</p>';
        }

        isStreaming = false;
        document.getElementById('chat-send-btn').disabled = false;
    });
}

/* 简易 Markdown 渲染 */
function renderMarkdown(text) {
    var html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`(.+?)`/g, '<code>$1</code>');
    html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
    html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
    html = html.replace(/^### (.+)$/gm, '<strong style="font-size:15px;">$1</strong>');
    html = html.replace(/^## (.+)$/gm, '<strong style="font-size:16px;">$1</strong>');
    html = html.replace(/\n\n/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>\s*<\/p>/g, '');
    return html;
}

/* ========== 搜索功能 ========== */
function switchSearchMode(mode) {
    searchMode = mode;
    document.querySelectorAll('.search-tab').forEach(function(t) {
        t.classList.toggle('active', t.getAttribute('data-mode') === mode);
    });
    var input = document.getElementById('search-input');
    var q = input.value.trim();
    if (mode === 'fulltext') {
        document.getElementById('search-results').style.display = 'block';
        document.getElementById('menu-tree').style.display = 'none';
        if (q) doFulltextSearch(q);
        else if (searchIndex) document.getElementById('search-results').innerHTML = '<div class="search-hint">输入关键字搜索手册正文内容</div>';
    } else {
        document.getElementById('search-results').style.display = 'none';
        document.getElementById('menu-tree').style.display = 'block';
        filterMenu(q);
    }
}

function clearSearch() {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').style.display = 'none';
    if (searchMode === 'fulltext') {
        document.getElementById('search-results').innerHTML = '<div class="search-hint">输入关键字搜索手册正文内容</div>';
    } else {
        filterMenu('');
    }
}

/* ========== 全文搜索索引 ========== */
function loadSearchIndex() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'manual/search_index.json', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                searchIndex = JSON.parse(xhr.responseText);
                console.log('搜索索引已加载: ' + searchIndex.length + ' 页');
            } catch(e) {
                console.log('搜索索引解析失败');
            }
        }
    };
    xhr.send();
}

function doFulltextSearch(query) {
    var container = document.getElementById('search-results');
    container.style.display = 'block';
    document.getElementById('menu-tree').style.display = 'none';

    var q = query.trim().toLowerCase();
    if (!q) {
        container.innerHTML = '<div class="search-hint">输入关键字搜索手册正文内容</div>';
        return;
    }
    if (!searchIndex) {
        container.innerHTML = '<div class="search-hint">搜索索引加载中...</div>';
        return;
    }

    var keywords = q.split(/\s+/).filter(function(k) { return k.length > 0; });
    if (keywords.length === 0) return;

    var results = [];
    var maxResults = 50;

    for (var i = 0; i < searchIndex.length && results.length < maxResults; i++) {
        var entry = searchIndex[i];
        var textLower = entry.text.toLowerCase();
        var titleLower = (entry.menu_title || entry.title).toLowerCase();

        var allMatch = true;
        for (var k = 0; k < keywords.length; k++) {
            if (textLower.indexOf(keywords[k]) < 0 && titleLower.indexOf(keywords[k]) < 0) {
                allMatch = false;
                break;
            }
        }
        if (!allMatch) continue;

        var firstKw = keywords[0];
        var idx = textLower.indexOf(firstKw);
        var snippet = '';
        if (idx >= 0) {
            var start = Math.max(0, idx - 40);
            var end = Math.min(entry.text.length, idx + firstKw.length + 60);
            snippet = (start > 0 ? '...' : '') + entry.text.substring(start, end) + (end < entry.text.length ? '...' : '');
        } else {
            snippet = entry.text.substring(0, 80) + '...';
        }

        snippet = highlightText(snippet, keywords);
        var displayTitle = highlightText(entry.menu_title || entry.title, keywords);

        results.push({ href: entry.href, title: displayTitle, snippet: snippet });
    }

    if (results.length === 0) {
        container.innerHTML = '<div class="search-hint">未找到包含 "' + escapeHtml(query) + '" 的页面</div>';
    } else {
        var html = '<div class="search-count">找到 ' + results.length + ' 个结果（共搜索 ' + searchIndex.length + ' 页）</div>';
        for (var j = 0; j < results.length; j++) {
            var r = results[j];
            html += '<div class="search-result-item" onclick="loadContent(\'' + r.href + '\');closeSidebar();">';
            html += '<div class="search-result-title">' + r.title + '</div>';
            html += '<div class="search-result-snippet">' + r.snippet + '</div>';
            html += '</div>';
        }
        if (results.length >= maxResults) {
            html += '<div class="search-hint">仅显示前 ' + maxResults + ' 条结果</div>';
        }
        container.innerHTML = html;
    }
}

function highlightText(text, keywords) {
    var escaped = escapeHtml(text);
    for (var i = 0; i < keywords.length; i++) {
        var kw = escapeHtml(keywords[i]);
        var regex = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        escaped = escaped.replace(regex, '<mark>$1</mark>');
    }
    return escaped;
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ========== 目录菜单 ========== */
function loadMenu() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'manual/menu_data.json', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            menuData = JSON.parse(xhr.responseText);
            renderMenu(menuData);
        }
    };
    xhr.send();
}

function renderMenu(items, container, level) {
    level = level || 0;
    container = container || document.getElementById('menu-tree');
    var ul = document.createElement('ul');
    ul.className = 'menu-level-' + level;

    items.forEach(function(item) {
        var li = document.createElement('li');
        var hasChildren = item.children && item.children.length > 0;

        if (hasChildren) {
            li.className = 'folder-item';
            var link = document.createElement('div');
            link.className = 'folder-header level-' + level;
            link.setAttribute('data-search', ((item.title || '') + ' ' + (item.title_en || '')).toLowerCase());

            var arrow = document.createElement('span');
            arrow.className = 'folder-arrow';
            arrow.innerHTML = '&#9654;';
            link.appendChild(arrow);

            var text = document.createElement('span');
            text.className = 'folder-title';
            text.textContent = item.title || '';
            link.appendChild(text);

            link.addEventListener('click', function(e) {
                arrow.classList.toggle('open');
                var subUl = li.querySelector(':scope > ul');
                if (subUl) subUl.classList.toggle('open');
                if (item.href) { loadContent('manual/' + item.href); closeSidebar(); }
            });
            li.appendChild(link);
            renderMenu(item.children, li, level + 1);

        } else if (item.href) {
            li.className = 'doc-item level-' + level;
            var link = document.createElement('div');
            link.className = 'doc-link';
            link.setAttribute('data-search', ((item.title || '') + ' ' + (item.title_en || '')).toLowerCase());
            link.textContent = item.title || '';
            link.addEventListener('click', function() {
                loadContent('manual/' + item.href); closeSidebar();
            });
            li.appendChild(link);

        } else if (item.title) {
            var link = document.createElement('div');
            link.className = 'doc-item plain level-' + level;
            link.textContent = item.title;
            li.appendChild(link);
        }
        ul.appendChild(li);
    });
    container.appendChild(ul);
}

function filterMenu(query) {
    var q = query.toLowerCase().trim();
    var tree = document.getElementById('menu-tree');
    var allItems = tree.querySelectorAll('[data-search]');
    if (!q) {
        allItems.forEach(function(el) { el.closest('li').style.display = ''; });
        tree.querySelectorAll('ul').forEach(function(ul) {
            if (ul.id !== 'menu-tree') ul.classList.remove('open');
        });
        tree.querySelectorAll('.folder-arrow').forEach(function(a) { a.classList.remove('open'); });
        return;
    }
    allItems.forEach(function(el) {
        var text = el.getAttribute('data-search') || '';
        if (text.indexOf(q) >= 0) {
            el.closest('li').style.display = '';
            var parent = el.closest('li').parentElement;
            while (parent && parent.id !== 'menu-tree') {
                if (parent.tagName === 'UL') parent.classList.add('open');
                var prev = parent.previousElementSibling;
                if (prev) { var a = prev.querySelector('.folder-arrow'); if (a) a.classList.add('open'); }
                parent = parent.parentElement;
            }
        } else {
            el.closest('li').style.display = 'none';
        }
    });
}

/* ========== iframe 内容加载 ========== */
function loadContent(url) {
    currentUrl = url;
    var iframe = document.getElementById('content-frame');
    document.getElementById('page-nav-bar').style.display = 'none';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = function() {
        if (xhr.status === 200) injectAndRender(xhr.responseText, url);
        else iframe.srcdoc = '<div style="padding:20px;color:red;">页面加载失败: ' + xhr.status + '</div>';
    };
    xhr.onerror = function() {
        iframe.srcdoc = '<div style="padding:20px;color:red;">网络错误</div>';
    };
    xhr.send();
}

function injectAndRender(html, url) {
    var iframe = document.getElementById('content-frame');
    var doc = new DOMParser().parseFromString(html, 'text/html');

    var title = doc.querySelector('title');
    if (title) document.getElementById('header-title').textContent = title.textContent;

    var prevInput = doc.querySelector('input[name="prev_html"]');
    var nextInput = doc.querySelector('input[name="next_html"]');
    prevUrl = prevInput ? prevInput.value : '';
    nextUrl = nextInput ? nextInput.value : '';

    var base = url.substring(0, url.lastIndexOf('/') + 1);
    var baseTag = document.createElement('base');
    baseTag.href = base;
    doc.head.insertBefore(baseTag, doc.head.firstChild);

    doc.querySelectorAll('img[src]').forEach(function(img) {
        var src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('data:'))
            img.setAttribute('src', resolveUrl(base, src));
    });
    doc.querySelectorAll('area[href]').forEach(function(area) {
        var href = area.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('javascript'))
            area.setAttribute('data-target', resolveUrl(base, href));
    });
    doc.querySelectorAll('a[href]').forEach(function(a) {
        var href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('javascript') && !href.startsWith('#')) {
            var resolved = resolveUrl(base, href);
            a.setAttribute('data-target', resolved);
            a.addEventListener('click', function(e) {
                e.preventDefault();
                window.parent.postMessage({type:'navigate', url: resolved}, '*');
            });
        }
    });
    var form = doc.querySelector('form[name="data"]');
    if (form) form.remove();

    var style = doc.createElement('style');
    style.textContent = 'body{margin:8px!important;padding:0!important;font-size:14px!important;overflow-x:hidden!important}#main{padding:0!important;margin:0!important}h2,h3{font-size:1.2em!important}table{max-width:100%!important;overflow-x:auto!important;display:block!important;font-size:12px!important}img{max-width:100%!important;height:auto!important}td,th{padding:4px 6px!important;word-break:break-word!important}.trHighlight td{background:#e3f2fd!important}@media(max-width:600px){body{font-size:13px!important;margin:4px!important}table{font-size:11px!important}td,th{padding:2px 3px!important}}';
    doc.head.appendChild(style);

    var script = doc.createElement('script');
    script.textContent = 'document.querySelectorAll("area[data-target]").forEach(function(a){a.addEventListener("click",function(){window.parent.postMessage({type:"navigate",url:this.getAttribute("data-target")},"*")})});window.addEventListener("load",function(){window.parent.postMessage({type:"resize",height:document.documentElement.scrollHeight},"*")});var obs=new MutationObserver(function(){window.parent.postMessage({type:"resize",height:document.documentElement.scrollHeight},"*")});obs.observe(document.body,{childList:true,subtree:true});';
    doc.head.appendChild(script);

    iframe.srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    updateNavBar();
}

function updateNavBar() {
    var navBar = document.getElementById('page-nav-bar');
    if (prevUrl || nextUrl) {
        navBar.style.display = 'flex';
        document.getElementById('nav-prev').style.visibility = prevUrl ? 'visible' : 'hidden';
        document.getElementById('nav-next').style.visibility = nextUrl ? 'visible' : 'hidden';
    } else {
        navBar.style.display = 'none';
    }
}
function goPrev() { if (prevUrl) loadContent(resolveUrl(currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1), prevUrl)); }
function goNext() { if (nextUrl) loadContent(resolveUrl(currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1), nextUrl)); }

window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'navigate') { loadContent(e.data.url); closeSidebar(); }
    if (e.data && e.data.type === 'resize')
        document.getElementById('content-frame').style.height = Math.max(e.data.height, 400) + 'px';
});

function resolveUrl(base, relative) {
    if (relative.startsWith('./')) relative = relative.substring(2);
    if (relative.startsWith('/')) return relative;
    var parts = base.split('/').filter(function(p) { return p; });
    relative.split('/').forEach(function(seg) {
        if (seg === '..') parts.pop();
        else if (seg !== '.' && seg !== '') parts.push(seg);
    });
    return parts.join('/');
}

/* ========== UI ========== */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
}
