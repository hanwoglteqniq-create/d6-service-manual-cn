function getToc() {

	var i;
	var lngTopicCount;
	var strHtml;
	var strSearch;
	var strString;

	// キーワードを代入する
	strSearch = document.topic.zip.value;
	strSearch = strSearch.toLowerCase();

	lngTopicCount = arrTopic.length;
	strHtml = "<nobr>";
	
	// キーワード入力されていない場合
	if (strSearch.length == 0) {
		
		// 配列にある全ての目次をピックアップし、<td id="toc" valign="top">の中に書き出す
		for (i = 0; i < lngTopicCount; i=i+2) {
			strHtml = strHtml + '<div><a class="menu" target="main" href="' + arrTopic[i+1] + '" title="' + arrTopic[i] + '">' + arrTopic[i] + '</a></div>';
		}
		strHtml = strHtml + "</nobr>";
		document.all.item("sub").innerHTML = strHtml;
		
		// キーワードにフォーカスを移す
		document.topic.zip.focus();
		
	// キーワード入力されている場合
	} else {
		
		// キーワードと配列より頭から一致している目次のみをピックアップし、
		// <td id="toc" valign="top">の中に書き出す
		for (i = 0; i < lngTopicCount; i=i+2) {
			strString = arrTopic[i].toLowerCase();
			var n = strString.indexOf(strSearch);
			if (n >= 0) {
				strHtml = strHtml + '<div><a class="menu" target="main" href="' + arrTopic[i+1] + '" title="' + arrTopic[i] + '">' + arrTopic[i] + '</a></div>';
			}

		}

	}

	strHtml = strHtml + "</nobr>";

	// 目次をdivタグの中に代入する
	document.all.item("sub").innerHTML = strHtml;
}
