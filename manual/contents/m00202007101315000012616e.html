<h2>048-323 CDM Download 模式 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711490500104df2.html">CH27.4</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>一次 电源 已 shut 下 在...期间 Download 模式, it is 始终 started in Download 模式.</p></div>
<h3>原因/措施</h3><ol><li><p>输入 Download 模式 to 执行 CDM Download.</p></li>
<li><p>If Download 不是 已完成 successfully, 更换 CDM 主电路板. (<a href="../contents/m002020090718073500146670.html">PL 43.3a</a>, <a href="../contents/m002020090718073600146a16.html">PL 43.3b</a>)</p></li>
</ol>
