<h2>064-326 ILS CALCAP 失败 ET&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m0020230313132713001182a8.html">CH70.11</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>An 错误 已 已检测 在...期间 Calib Image Scanning (入口 侧面).</p></div>
<h3>原因/措施</h3><ol><li><p>关闭电源, 和 检查 排线 之间 the ILS CCD PWB (入口) <a href="../contents/m0020230207190839000f8a17.html#LinkSetterTool.eps.23030308363755900149-J">J700ET</a> 和 the ILS直流电源板 <a href="../contents/m0020200901162437000f924c.html#LinkSetterTool.eps.20091714572736200211-J">J8</a> 用于 打开 电路, 短路 电路, or 接触不良.</p></li>
<li><p>如果问题仍然存在，更换ILS直流电源板. (<a href="../contents/m00202302031631450014839c.html">PL 76.9</a>)</p></li>
</ol>
