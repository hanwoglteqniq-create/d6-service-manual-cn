<h2>049-972 堆叠器 Middle 堆叠&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:</h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>The 堆叠 电平 on 堆叠器 具有 reached or exceeded the 设置.</p></div>
<h3>初始 措施</h3><p>The Fault 代码 和 组件 代码 (DC330) of HCS1, HCS2 is 049-xxx 用于 HCS1 和 149-xxx 用于 HCS2. 确认编号后执行操作. of HCS.</p><h3>原因/措施</h3><p>拆卸 纸张 从 堆叠器 和 检查以下项目 设置:</p><ul><li><p>HCS 1: NVM[991-160 ~ 171]</p></li>
<li><p>HCS 2: NVM[992-160 ~ 171]</p></li>
</ul>
