<h2>6.2.8.5 SBFT 概述&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<p>SBFT is the post processing 设备 用于 装订器 D6 (小册子制作器), able to decrease the 小册子 bulge by flatting the 小册子 shoulder 和/与 方背折叠裁切器, as 好 as to 执行 裁切 post process 用于 小册子 cutting.</p>
