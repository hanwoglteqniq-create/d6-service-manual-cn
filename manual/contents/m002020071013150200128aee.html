<h2>049-287 系统 错误&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m0020200827114913001052b8.html">CH29.5a</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>错误 具有 occurred in the PWB.</p></div>
<h3>初始 措施</h3><p>The Fault 代码 和 组件 代码 (DC330) of HCS1, HCS2 is 049-xxx 用于 HCS1 和 149-xxx 用于 HCS2. 确认编号后执行操作. of HCS.</p><h3>原因/措施</h3><ol><li><p>关闭再打开电源.</p></li>
<li><p>如果 问题 persists, 更换 HCS电路板. (<a href="../contents/m002020090718073200143c32.html">PL 39.37</a>)</p></li>
</ol>
<p></p>
