<h2>064-319 ILS NVM 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:</h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>NVM access 错误 in the ILS 已 已检测.</p></div>
<h3>原因/措施</h3><ol><li><p>关闭再打开电源.</p></li>
<li><p>安装 a 固件 和/与 正确的 版本.</p></li>
<li><p>Initialize the NVM.</p></li>
<li><p>如果问题仍然存在，更换ILS直流电源板. (<a href="../contents/m00202302031631450014839c.html">PL 76.9</a>)</p></li>
</ol>
