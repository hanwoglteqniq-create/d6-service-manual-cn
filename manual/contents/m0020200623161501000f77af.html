<li><p>断开 每个 连接器.</p></li>
<li><p>拆卸 CDM770 从 IOT. (图 1)</p><ol class="ollevel2"><li><p>打开 the 前面 门.</p></li>
<li><p>拆卸螺钉.</p></li>
<li><p>拉动 停止 对接 板.</p></li>
<li><p>拆卸 CDM770.</p></li>
</ol>
