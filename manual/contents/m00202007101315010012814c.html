<h2>049-235 侧面 防篡改 Extension 原位传感器 关闭/脱离 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>当...时 the extension is being 设置, the 侧面 防篡改 Extension 原位传感器 已执行 不 change 从 ON to 关闭/脱离. (A 故障 已检测到 当...时 it 移动 从 the 释放 位置 (原位 位置) -&gt; the 设置 位置)</p></div>
