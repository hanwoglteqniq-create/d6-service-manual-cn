<h2>024-988 信封 折叠器 纸盘 打开&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m0020200827114941001061fa.html">CH38.2</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>信封 纸盘 互锁 开关 和 折叠器 信封 纸盘 +24V Detect 关闭/脱离 已 已检测.</p></div>
<h3>原因/措施</h3><p>检查以下项目：</p><ul><li><p>设置 mistake 的 信封 纸盘.</p></li>
<li><p>The 信封 纸盘 互锁 开关 (DC330 [013-156]) 用于 操作 故障. (<a href="../contents/m0020200907180816001605a2.html">PL 50.7</a>)</p><p></p></li>
</ul>
<p>If 编号 问题 发现, 更换 折叠器 PWB. (<a href="../contents/m00202009071808150015fb41.html">PL 50.4</a>)</p><p></p>
