<h2>048-335 CDM 冷却 风扇 3 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711490600104ee0.html">CH27.11</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<ul><li><p>CDM: 滑槽 冷却 风扇 1 (风扇 3) 不 旋转.</p></li>
</ul>
</div>
<h3>原因/措施</h3><ol><li><p>检查 滑槽 冷却 风扇 1 (DC330 [048-050]) 用于 操作 故障. (<a href="../contents/m00202009071807390014942c.html">PL 43.11a</a>, <a href="../contents/m0020200907180739001496f7.html">PL 43.11b</a>)</p></li>
<li><p>检查 滑槽 冷却 风扇 1 or 感光鼓 冷却 风扇 1 用于 foreign substances.</p></li>
<li><p>If 编号 问题 发现, 更换 CDM 主电路板. (<a href="../contents/m002020090718073500146670.html">PL 43.3a</a>, <a href="../contents/m002020090718073600146a16.html">PL 43.3b</a>)</p></li>
</ol>
<p></p>
