<h2>048-940 SEM 辊 不 Detect (Revoria 按下 PC1120, Revoria 按下 E1136)&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002021061719293400104b73.html">CH33.6</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>编号 charge 已检测到.</p></div>
<h3>原因/措施</h3><ol><li><p>Reinstall the BTR 单元.</p></li>
<li><p>关闭电源 和 检查 连接 之间 the SEM PWB <a href="../contents/m0020210618132903000f7e5c.html#LinkSetterTool.eps.21062915145899601958-J">J8762</a> 和 the HVPS(PR12) <a href="../contents/m0020210618132903000f7e4e.html#LinkSetterTool.eps.21062915145899601944-J">J582</a> 用于 打开 电路, 短路 电路, 和 接触不良.</p></li>
<li><p>如果 问题 persists, 更换 HVPS (PR12). (<a href="../contents/m00202106171558250014c1f6.html">PL 75.3</a>)</p></li>
</ol>
<p></p>
