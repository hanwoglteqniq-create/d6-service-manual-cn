<h2>024-987 信封 折叠器 纸盘 满载/完整 堆叠&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m00202008271149420010630a.html">CH38.10</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>信封 纸盘 满载/完整 传感器 ON 已 已检测 用于 指定的 时间 or longer.</p></div>
<h3>原因/措施</h3><ol><li><p>拆卸 纸张 从 纸盘.</p></li>
<li><p>检查 信封 纸盘 满载/完整 传感器 用于 contamination.</p></li>
<li><p>检查 信封 纸盘 满载/完整 传感器 (DC330 [013-123]) 用于 操作 故障. (<a href="../contents/m002020090718082000163365.html">PL 50.24</a>)</p></li>
<li><p>如果 问题 persists, 更换 折叠器 PWB. (<a href="../contents/m00202009071808150015fb41.html">PL 50.4</a>)</p></li>
</ol>
<p></p>
