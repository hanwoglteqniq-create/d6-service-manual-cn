<h2>012-319 小册子 子 CPU Download 模式 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m00202008271148540010484e.html">CH17.15</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>当...时 the 小册子 controlling 子 CPU 已 downloading 数据, it ended abnormally 和 可以 仅 启动 in the Download 模式 at 开机.</p><div class="note"><img src="../../../common_e2/images/note.jpg"/><p>此 失败 is a 子 系统 故障 和 其 occurrence cuts 关闭/脱离 the Intlk_+24VDC. (请参阅 BSD <a href="../contents/m00202008271148520010471c.html">CH17.7</a>)</p></div>
</div>
<h3>原因/措施</h3><p><a href="../contents/m00202007101314530011f942.html">012-269</a> 请参阅 FIP (小册子 子 CPU 通信 失败).</p><p></p>
