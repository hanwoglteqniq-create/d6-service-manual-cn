<h2>041-391 装订器 Logic 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711485300104760.html">CH17.9</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>装订器 软件 控制 错误 已 已检测.</p><div class="note"><img src="../../../common_e2/images/note.jpg"/><p>此 失败 is a 子 系统 故障 和 其 occurrence cuts 关闭/脱离 the Intlk_+24VDC. (请参阅 BSD <a href="../contents/m00202008271148520010471c.html">CH17.7</a>)</p></div>
</div>
<h3>原因/措施</h3><ol><li><p>关闭再打开电源.</p></li>
<li><p>安装 正确的 版本 of IOT 固件.</p></li>
<li><p>如果 问题 persists, 更换 MCU PWB of IOT.</p></li>
</ol>
