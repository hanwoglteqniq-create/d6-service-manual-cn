<h2>6.2.1.12 CDM 和 IFM 纸张 卷曲 电阻&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<ul><li><p>纸张 输出 从 IOT 和/与 curls 不 exceeding 20 mm is supported. (IFM is 12.7 mm或 更少)</p><ul><li><p>测量 方法: 测量 最大 高度 当...时 纸张 该 已 只是 输出 从 IOT is placed on a horizontal 和 flat 表.</p></li>
</ul>
<p>但是, 当...时 纸张 和/与 curls 该 exceed 8 mm is used, the performance 不是 guaranteed.</p></li>
</ul>
