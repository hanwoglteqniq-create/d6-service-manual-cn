<h2>2.2.3.7 电机 左侧 Running 故障 FIP&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h3>步骤</h3>
<div id="imgArea" class="imageArea" align="center">
<img src="../figures/2005_en.jpg"/>
<map name="2005_en">
</map><p align="center">(图 1) 2005</p></div>
<div class="decl">关闭电源. 断开 PWB 连接器. Is the 电阻 之间 the 连接器引脚-3 和 框架 10 <span style="font-family:Symbol;">W</span> or 下方?</div>
<p class="yn"><a class="yn-yes" onClick="yesClicked('fip.00001')" href="#fip.00001">是</a>&nbsp;  <a id="fip.00002no" CLASS="yn-no" href="javascript:yesClicked('fip.00002')">编号</a></p><div class="no-branch-line"><div id="fip.00002" CLASS="no-branch"><p>更换 PWB.</p></div></div>
<div id="fip.00001"><p>检查 连接 之间 the 连接器引脚-3 和 电机 销-2 用于 a 短路 电路.</p><p>If 编号 问题 发现, 更换 电机.</p></div>
