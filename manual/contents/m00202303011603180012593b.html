<h2>064-217 ILS 风扇 #L1 EX 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002023031313271300118599.html">CH70.18</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>An 错误 已 已检测 in the 灯 单元 风扇 在...上 出纸 侧面.</p></div>
<h3>原因/措施</h3><ol><li><p>检查 出纸 风扇 L1 (DC330 [064-154]) 用于 操作 故障. (<a href="../contents/m00202302031631450014839c.html">PL 76.9</a>)</p></li>
<li><p>检查 出纸 风扇 L1 用于 foreign matter.</p></li>
<li><p>If 编号 问题 发现 在...之后 checking, 更换 ILS直流电源板. (<a href="../contents/m00202302031631450014839c.html">PL 76.9</a>)</p></li>
</ol>
