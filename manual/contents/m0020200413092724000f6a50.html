<h2>6.2.7.5 装订器 D6 概述&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<p>装订器 D6 is a post-processing 设备 该 is capable of performing 100 纸张 装订针, 3000 纸张 堆叠, 打孔, Saddle 装订/中央 折叠, Z 折叠 半/一半 纸张/C 折叠 和 盖板 attachment. It supports IOT 用于 最大到 136 ppm 和 A4/8.5 inch LEF 纸张 at the acceptance 速度 of 1000 mm/s.</p>
