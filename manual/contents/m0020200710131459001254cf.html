<h2>024-978 小册子 装订针 NG&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711485800104a6e.html">CH17.27</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<ul><li><p>在...期间 小册子 装订针 操作, 输出 of 装订针 Head 位置传感器 已执行 不 change 从 关闭/脱离 to ON 在规定时间内.</p></li>
<li><p>装订针 Head 位置传感器 ON 已 已检测 在...后的规定时间内 Reverse 操作.</p><p></p></li>
</ul>
</div>
<h3>初始 措施</h3><p>检查是否 装订针 jamming 具有 occurred.</p><h3>原因/措施</h3><ol><li><p>关闭再打开电源.</p></li>
<li><p>如果 问题 persists, proceed to 012-246 FIP (小册子 Stapler 失败).</p></li>
</ol>
<p></p>
