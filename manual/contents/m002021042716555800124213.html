<h2>048-300 CDM 前面 门 打开&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711490400104dae.html">CH27.2</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>CDM 前面 门 互锁 开关 打开 已 已检测.</p></div>
<h3>原因/措施</h3><p>检查以下项目：</p><ul><li><p>The CDM 互锁 开关 (DC330 [048-120]) 用于 操作 故障. (<a href="../contents/m00202009071807390014942c.html">PL 43.11a</a>, <a href="../contents/m0020200907180739001496f7.html">PL 43.11b</a>)</p></li>
<li><p>The CDM 前面 门 用于 损坏 or mismatch.</p><p></p></li>
</ul>
<p>If 编号 问题 发现, 更换 CDM 主电路板. (<a href="../contents/m002020090718073500146670.html">PL 43.3a</a>, <a href="../contents/m002020090718073600146a16.html">PL 43.3b</a>)</p><p></p>
