<h2>013-271 TCB 数据 Flash 内存 读/写 失败&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m00202008271149240010584a.html">CH36.5</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>An 错误 具有 occurred 在...期间 TCB 数据 Flash 内存 读/写. (IC 故障)</p></div>
<h3>原因/措施</h3><ol><li><p>关闭再打开电源.</p></li>
<li><p>检查 连接 之间 装订器 D6主电路板 J8064A 和 the TCBM主电路板 <a href="../contents/m0020200901165053000f813e.html#LinkSetterTool.eps.20091710373358600106-J">J41</a> 用于 打开 电路, 短路 电路, 和 接触不良.</p></li>
<li><p>If 编号 问题 发现, 更换 TCBM主电路板. (<a href="../contents/m00202009071808040015865f.html">PL 47.3</a>)</p></li>
</ol>
<p></p>
