<h2>024-932 装订针 Box Detect&nbsp;<a href="javascript:fullTopic();"><img src="../../../common_e2/images/full_a.gif"/></a></h2>

<h4>参考BSD:<a href="../contents/m002020082711490000104ba0.html">CH17.36</a></h4>
<div style="color:blue;margin-top:10px;margin-bottom:10px;"><img src="../../../common_e2/images/description.jpg"/>
<p>装订针 Box 设置 传感器 已检测 该 装订针 Waste Container 已执行 不 exist.</p></div>
<h3>原因/措施</h3><ol><li><p>Reinstall 装订针 Waste Container.</p></li>
<li><p>检查 装订针 Waste Container 设置 传感器 (DC330 [012-230]) 用于 操作 故障. (<a href="../contents/m002020090718070900132a71.html">PL 27.5</a>)</p></li>
<li><p>如果未发现问题，更换装订器 D6主电路板. (<a href="../contents/m002020090718071700139141.html">PL 27.29</a>)</p></li>
</ol>
<p></p>
